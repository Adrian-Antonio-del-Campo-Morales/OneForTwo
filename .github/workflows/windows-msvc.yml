name: Windows MSVC

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cmake-guards:
    name: CMake SDK/API guards
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run negative CMake checks
        shell: pwsh
        run: ./tests/capture_windows/test_cmake_guards.ps1

  build:
    name: WGC (MSVC x64, SDK ${{ matrix.sdk }})
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # El mínimo declarado por el backend.
          - sdk: "10.0.19041.0"
            platform: "x64,version=10.0.19041.0"
            label: minimum
          # SDK por defecto de la imagen; seguirá al SDK actual cuando se actualice.
          - sdk: "default"
            platform: "x64"
            label: current

    steps:
      - uses: actions/checkout@v4

      - name: Configure (${{ matrix.label }})
        shell: pwsh
        run: >
          cmake -S cmake/capture_windows -B build/windows-msvc-${{ matrix.sdk }}
          -G "Visual Studio 17 2022" -A "${{ matrix.platform }}"
          -DONEINTWO_BUILD_TESTS=ON
          -DONEINTWO_CAPTURE_QT=OFF
          -DONEINTWO_REQUIRE_WGC=ON

      - name: Build backend, link check and tests (${{ matrix.label }})
        shell: pwsh
        run: >
          cmake --build build/windows-msvc-${{ matrix.sdk }} --config Release
          --target oneintwo_capture_windows oneintwo_capture_windows_link_check
          oneintwo_capture_windows_tests oneintwo_wgc_capture_tests
          oneintwo_wgc_probe_tests oneintwo_wgc_probe

      - name: Probe WGC runtime dependencies (${{ matrix.label }})
        shell: pwsh
        run: |
          & "build/windows-msvc-${{ matrix.sdk }}/Release/oneintwo_wgc_probe.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run capture tests (${{ matrix.label }})
        shell: pwsh
        run: >
          ctest --test-dir build/windows-msvc-${{ matrix.sdk }} -C Release
          --output-on-failure
