name: notifications-windows

on:
  push:
    branches:
      - ci/notifications-windows
    paths:
      - "src/**"
      - "cmake/notifications/**"
      - "tests/notifications/**"
      - ".github/workflows/notifications-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure, build and test with MSVC
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-logs | Out-Null
          $status = @()
          $status += "runner=$env:ImageOS"
          cmake --version *> ci-logs/versions.txt
          cmake -S cmake/notifications -B build/notifications -A x64 `
                -DONEINTWO_BUILD_TESTS=ON `
                -DONEINTWO_BUILD_NATIVE_NOTIFICATION_TESTS=ON *> ci-logs/configure.log
          $configure = $LASTEXITCODE
          $status += "configure=$configure"

          $build = -1
          if ($configure -eq 0) {
            cmake --build build/notifications --config Debug -- /m *> ci-logs/build.log
            $build = $LASTEXITCODE
            $status += "build=$build"
          }

          $test = -1
          if ($build -eq 0) {
            ctest --test-dir build/notifications -C Debug `
                  -E "notifications-native-windows" --output-on-failure *> ci-logs/test.log
            $test = $LASTEXITCODE
            $status += "test=$test"
          }

          $status | Set-Content ci-logs/status.txt
          Get-Content ci-logs/status.txt
          if ($configure -ne 0 -or $build -ne 0 -or $test -ne 0) { exit 1 }

      - name: Publish build logs to the branch
        if: always()
        shell: pwsh
        run: |
          git config user.name "oneintwo-ci"
          git config user.email "ci@users.noreply.github.com"
          git add ci-logs
          if (-not (git status --porcelain ci-logs)) {
            Write-Host "No changes in ci-logs"
            exit 0
          }
          git commit -m "ci: windows build logs [skip ci]"
          git push origin "HEAD:refs/heads/${{ github.ref_name }}"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notifications-windows-logs
          path: ci-logs

  msix:
    needs: msvc
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure static package build
        id: configure_msix
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-logs/msix | Out-Null
          cmake -S cmake/notifications -B build/notifications-msix -A x64 `
                -DONEINTWO_BUILD_TESTS=ON `
                -DONEINTWO_BUILD_NATIVE_NOTIFICATION_TESTS=ON `
                -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded 2>&1 |
            Tee-Object ci-logs/msix/configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build native package payload
        id: build_msix
        shell: pwsh
        run: |
          $exe = "build/notifications-msix/tests/notifications/Release/oneintwo_notifications_native_windows.exe"
          cmake --build build/notifications-msix --config Release `
                --target oneintwo_notifications_native_windows -- /m 2>&1 |
            Tee-Object ci-logs/msix/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $exe)) {
            Write-Error "The build did not produce $exe"
            exit 1
          }

      - name: Validate, pack and sign MSIX
        id: package_msix
        timeout-minutes: 8
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & ".\src\platform\windows\notification_support\msix\New-NativeCheckPackage.ps1" `
              -Executable "build\notifications-msix\tests\notifications\Release\oneintwo_notifications_native_windows.exe" `
              -OutputDirectory "artifacts\msix" 2>&1 |
            Tee-Object -FilePath "ci-logs\msix\package.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test MSIX install and removal
        id: smoke_msix
        if: always() && steps.package_msix.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $msix = (Resolve-Path "artifacts\msix\OneInTwo-NativeCheck.msix").Path
          $cer = (Resolve-Path "artifacts\msix\OneInTwo-NativeCheck.cer").Path
          $logDir = "ci-logs\msix"
          New-Item -ItemType Directory -Force $logDir | Out-Null
          $resultPath = Join-Path $logDir "smoke.txt"
          $lines = @("runner=$env:ImageOS")
          $certificate = $null
          $installed = @()
          $smoke = "failed"

          try {
            try {
              $certificate = Import-Certificate -FilePath $cer `
                  -CertStoreLocation "Cert:\LocalMachine\TrustedPeople" -ErrorAction Stop
              $lines += "trust=LocalMachine\TrustedPeople"
              $lines += "certificate_thumbprint=$($certificate.Thumbprint)"
            } catch {
              $smoke = "unavailable"
              $lines += "trust=unavailable"
              $lines += "trust_error=$($_.Exception.Message)"
              throw
            }

            Get-AppxPackage -Name "OneInTwo.Notifications.NativeCheck" -ErrorAction SilentlyContinue |
                Remove-AppxPackage -ErrorAction SilentlyContinue

            $installLog = Join-Path $logDir "smoke-install.log"
            $installErr = Join-Path $logDir "smoke-install.err.log"
            $installStatusPath = Join-Path $logDir "smoke-install.status.log"
            Remove-Item -LiteralPath $installStatusPath -Force -ErrorAction SilentlyContinue
            $escapedMsix = $msix.Replace("'", "''")
            $escapedStatus = $installStatusPath.Replace("'", "''")
            $installCommand = "try { Add-AppxPackage -Path '$escapedMsix' -ErrorAction Stop; Set-Content -LiteralPath '$escapedStatus' -Value 'ok' -Encoding ASCII -ErrorAction Stop } catch { Set-Content -LiteralPath '$escapedStatus' -Value ('failed=' + `$_.Exception.Message) -Encoding ASCII -ErrorAction Stop; exit 1 }"
            $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($installCommand))
            $process = Start-Process -FilePath "powershell.exe" `
                -ArgumentList @("-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-EncodedCommand", $encoded) `
                -NoNewWindow -PassThru `
                -RedirectStandardOutput $installLog -RedirectStandardError $installErr
            if (-not $process.WaitForExit(90000)) {
              try { $process.Kill() } catch { }
              [void]$process.WaitForExit(5000)
              $smoke = "unavailable"
              $lines += "install=timeout"
              throw "Add-AppxPackage did not finish within 90 seconds."
            }
            $installStatus = "missing"
            if (Test-Path -LiteralPath $installStatusPath) {
              $installStatus = (Get-Content -LiteralPath $installStatusPath -Raw).Trim()
            }
            $lines += "install_status=$installStatus"
            $installExit = $null
            try { $installExit = $process.ExitCode } catch { }
            if ($null -eq $installExit) {
              $lines += "install_exit=unavailable"
            } else {
              $lines += "install_exit=$installExit"
            }
            if ($installStatus -ne "ok") {
              throw "Add-AppxPackage did not complete: $installStatus"
            }

            $deadline = (Get-Date).AddSeconds(15)
            do {
              $installed = @(Get-AppxPackage -Name "OneInTwo.Notifications.NativeCheck" -ErrorAction SilentlyContinue)
              if ($installed.Count -gt 0) { break }
              Start-Sleep -Milliseconds 500
            } while ((Get-Date) -lt $deadline)
            if ($installed.Count -eq 0) {
              throw "Add-AppxPackage finished, but the package is missing from the registry of installed packages."
            }
            $lines += "installed=$($installed[0].PackageFullName)"

            $packageFullName = $installed[0].PackageFullName
            Remove-AppxPackage -Package $packageFullName -ErrorAction Stop
            $lines += "removed=$packageFullName"
            $installed = @()
            $smoke = "ok"
          } catch {
            $lines += "smoke_error=$($_.Exception.Message)"
          } finally {
            if ($certificate) {
              try {
                Remove-Item -LiteralPath "Cert:\LocalMachine\TrustedPeople\$($certificate.Thumbprint)" `
                    -Force -ErrorAction Stop
                $lines += "certificate_removed=true"
              } catch {
                $lines += "certificate_removed=false"
                $lines += "certificate_cleanup_error=$($_.Exception.Message)"
              }
            }
            try {
              $remaining = @(Get-AppxPackage -Name "OneInTwo.Notifications.NativeCheck" -ErrorAction SilentlyContinue)
              foreach ($package in $remaining) {
                Remove-AppxPackage -Package $package.PackageFullName -ErrorAction Stop
              }
              if ($remaining.Count -gt 0) {
                $lines += "cleanup_removed=$($remaining.Count)"
              }
            } catch {
              $lines += "cleanup_error=$($_.Exception.Message)"
            }
            $lines += "smoke=$smoke"
            $lines | Set-Content -LiteralPath $resultPath -Encoding UTF8
            try {
              Copy-Item -LiteralPath $resultPath -Destination "artifacts\msix\smoke.txt" -Force
            } catch {
              Write-Warning "No se pudo copiar smoke.txt al artefacto: $($_.Exception.Message)"
            }
            $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            $lines | ForEach-Object { Write-Output $_ }
          }
          exit 0

      - name: Upload MSIX artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneintwo-notifications-msix
          path: |
            artifacts/msix/OneInTwo-NativeCheck.msix
            artifacts/msix/OneInTwo-NativeCheck.cer
            artifacts/msix/install.txt
            artifacts/msix/validation.txt
            artifacts/msix/smoke.txt
            artifacts/msix/*.log
          if-no-files-found: warn

      - name: Publish MSIX logs to the branch
        if: always()
        shell: pwsh
        run: |
          git config user.name "oneintwo-ci"
          git config user.email "ci@users.noreply.github.com"
          $snapshot = Join-Path $env:RUNNER_TEMP "oneintwo-msix-logs"
          if (Test-Path $snapshot) { Remove-Item $snapshot -Recurse -Force }
          if (Test-Path ci-logs/msix) { Copy-Item ci-logs/msix $snapshot -Recurse -Force }
          git fetch origin "refs/heads/${{ github.ref_name }}:refs/remotes/origin/${{ github.ref_name }}"
          git reset --hard "origin/${{ github.ref_name }}"
          if (Test-Path $snapshot) {
            New-Item -ItemType Directory -Force ci-logs/msix | Out-Null
            Copy-Item "$snapshot\*" ci-logs/msix -Force
          }
          if (Test-Path artifacts/msix/validation.txt) {
            Copy-Item artifacts/msix/validation.txt ci-logs/msix/validation.txt -Force
          }
          if (Test-Path artifacts/msix/install.txt) {
            Copy-Item artifacts/msix/install.txt ci-logs/msix/install.txt -Force
          }
          $status = @(
            "configure=${{ steps.configure_msix.outcome }}"
            "build=${{ steps.build_msix.outcome }}"
            "package=${{ steps.package_msix.outcome }}"
          )
          $status | Set-Content ci-logs/msix/status.txt
          git add ci-logs/msix
          if (-not (git status --porcelain ci-logs/msix)) {
            Write-Host "No changes in ci-logs/msix"
            exit 0
          }
          git commit -m "ci: windows msix logs [skip ci]"
          git push origin "HEAD:refs/heads/${{ github.ref_name }}"

      - name: Write MSIX summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path artifacts/msix/validation.txt) {
            Get-Content artifacts/msix/validation.txt |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
